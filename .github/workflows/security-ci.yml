name: Security CI Pipeline

# Demonstrates DevSecOps maturity — automated security gates on every push,
# plus an optional live authorized-scan run using HAKUZA's own autopilot
# pipeline (not a bolted-on external scanner — the flagship tool testing
# itself in CI).
# Built by Divith D Shetty | CEH · CRTP · CAISP

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly dependency audit at 02:00 UTC
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain/URL for a live HAKUZA autopilot run (authorized scope only)"
        required: false
        default: ""
      profile:
        description: "Autopilot scan profile"
        required: false
        default: "quick"
        type: choice
        options: [quick, full]

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ─────────────────────────────────────────────
  # 1. SAST — Static Application Security Testing
  # ─────────────────────────────────────────────
  sast:
    name: "SAST · Static Analysis"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install analysis tools
        run: |
          pip install bandit semgrep

      - name: Bandit — Python security linter
        run: |
          bandit -r . -f sarif -o bandit-results.sarif \
            --exclude ./.venv,./venv \
            --severity-level medium \
            --confidence-level medium || true
        continue-on-error: true

      - name: Upload Bandit SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: bandit-results.sarif
          category: bandit

      - name: Semgrep — OWASP + secrets rules
        run: |
          semgrep --config "p/owasp-top-ten" \
                  --config "p/python" \
                  --config "p/secrets" \
                  --sarif \
                  --output semgrep-results.sarif \
                  --quiet || true
        continue-on-error: true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        if: github.event_name == 'push'
        with:
          languages: python

  # ─────────────────────────────────────────────
  # 2. SCA — Software Composition Analysis
  # ─────────────────────────────────────────────
  dependency-audit:
    name: "SCA · Dependency Audit"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: pip-audit — CVE check on dependencies
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt \
            --format json \
            --output pip-audit-results.json || true

      - name: Upload dependency audit artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-audit-results
          path: pip-audit-results.json

  # ─────────────────────────────────────────────
  # 3. Secrets Scanning
  # ─────────────────────────────────────────────
  secrets-scan:
    name: "Secrets · Gitleaks + Trufflehog"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks — scan entire git history
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: TruffleHog — entropy + regex secrets
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --debug --only-verified
        continue-on-error: true

  # ─────────────────────────────────────────────
  # 4. Container Security (only if a Dockerfile is added later)
  # ─────────────────────────────────────────────
  container-scan:
    name: "Container · Trivy Image Scan"
    runs-on: ubuntu-latest
    if: hashFiles('Dockerfile') != ''
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t hakuza:${{ github.sha }} .

      - name: Trivy — vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: hakuza:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"
          exit-code: "1"
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy

  # ─────────────────────────────────────────────
  # 5. HAKUZA Autopilot — live authorized scan
  #    (the flagship tool exercising itself, not an external scanner
  #    bolted onto the pipeline — only runs when a target is supplied
  #    via workflow_dispatch, never automatically on push/PR)
  # ─────────────────────────────────────────────
  hakuza-autopilot-scan:
    name: "HAKUZA · Live Autopilot Run"
    runs-on: ubuntu-latest
    if: github.event.inputs.target != ''
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install HAKUZA dependencies
        run: pip install -r requirements.txt

      - name: Install nmap + dig (ubuntu-latest doesn't ship these by default)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nmap dnsutils

      - name: Install recon/scan tools (subfinder, httpx, nuclei, katana, waybackurls)
        run: |
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
          go install -v github.com/projectdiscovery/httpx/cmd/httpx@latest
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/projectdiscovery/katana/cmd/katana@latest
          go install -v github.com/tomnomnom/waybackurls@latest
          echo "$HOME/go/bin" >> $GITHUB_PATH
        env:
          GOPATH: ${{ runner.temp }}/go

      - name: Run HAKUZA autopilot against the authorized target
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 hakuza.py init "ci-run-${{ github.run_id }}" \
            --client "CI Pipeline" \
            --target "${{ github.event.inputs.target }}" \
            --type web
          python3 hakuza.py scope --add "${{ github.event.inputs.target }}/*"
          python3 hakuza.py autopilot --profile "${{ github.event.inputs.profile || 'quick' }}"
          python3 hakuza.py report --html

      - name: Upload HAKUZA scan report + findings DB
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hakuza-autopilot-report
          path: |
            ~/.hakuza/engagements/ci-run-${{ github.run_id }}/reports/
            ~/.hakuza/engagements/ci-run-${{ github.run_id }}/autopilot_run_*.json

  # ─────────────────────────────────────────────
  # 6. Security Gate — Block merge on critical findings
  # ─────────────────────────────────────────────
  security-gate:
    name: "Gate · Block on Critical Findings"
    runs-on: ubuntu-latest
    needs: [sast, dependency-audit, secrets-scan]
    if: always()
    steps:
      - name: Check job statuses
        run: |
          SAST_STATUS="${{ needs.sast.result }}"
          DEP_STATUS="${{ needs.dependency-audit.result }}"
          SECRETS_STATUS="${{ needs.secrets-scan.result }}"

          echo "SAST: $SAST_STATUS"
          echo "Dependencies: $DEP_STATUS"
          echo "Secrets: $SECRETS_STATUS"

          # Gate: fail if secrets were found (non-negotiable)
          if [ "$SECRETS_STATUS" = "failure" ]; then
            echo "BLOCKED: Secrets detected in codebase. Remove before merging."
            exit 1
          fi

          echo "Security gate PASSED."
