name: Trigger Test

"on":
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      target:
        description: "Target domain/URL for a live HAKUZA autopilot run (authorized scope only)"
        required: false
        default: ""
      profile:
        description: "Autopilot scan profile"
        required: false
        default: "quick"
        type: choice
        options: [quick, full]

permissions:
  contents: read
  security-events: write
  pull-requests: write

env:
  PYTHON_VERSION: "3.11"

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - run: echo test
