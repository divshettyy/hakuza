<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HAKUZA{% endblock %} · HAKUZA</title>
  <style>
    :root{
      --bg:#0d1117; --surface:#161b22; --elevated:#1c2230; --border:#30363d;
      --text:#c9d1d9; --heading:#f0f6fc; --muted:#8b949e; --accent:#58a6ff;
      --crit:#f85149; --high:#d29922; --med:#3fb950; --low:#58a6ff; --info:#8b949e;
      --radius:12px; --shadow:0 1px 0 rgba(1,4,9,.4),0 8px 24px rgba(1,4,9,.25);
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;background:var(--bg);color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;
    }
    a{color:var(--accent);text-decoration:none}
    a:hover{text-decoration:underline}
    code,pre,.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}

    /* ---- top bar ---- */
    header.topbar{
      position:sticky;top:0;z-index:20;
      background:rgba(13,17,23,.82);backdrop-filter:blur(10px);
      border-bottom:1px solid var(--border);
    }
    .topbar-inner{
      max-width:1180px;margin:0 auto;padding:14px 24px;
      display:flex;align-items:center;gap:16px;
    }
    .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.14em;
      color:var(--heading);font-size:15px}
    .brand .logo{
      width:30px;height:30px;border-radius:8px;display:grid;place-items:center;
      background:linear-gradient(135deg,#1f6feb,#a371f7);color:#fff;font-weight:900;
      font-size:15px;box-shadow:0 0 0 1px rgba(163,113,247,.4),0 4px 14px rgba(31,111,235,.35)}
    .brand small{font-weight:500;letter-spacing:.02em;color:var(--muted);font-size:12px;margin-left:2px}
    .topbar-inner .spacer{flex:1}
    .crumb{color:var(--muted);font-size:13.5px}
    .crumb a{color:var(--muted)}
    .crumb .sep{opacity:.5;margin:0 8px}

    /* ---- layout ---- */
    main{max-width:1180px;margin:0 auto;padding:34px 24px 80px}
    .page-head{margin:0 0 26px}
    .page-head h1{margin:0 0 6px;font-size:26px;color:var(--heading);letter-spacing:-.01em}
    .page-head .sub{color:var(--muted);font-size:14px}

    /* ---- badges ---- */
    .badge{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;
      font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;line-height:1.7}
    .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
    .pill{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;
      background:var(--elevated);border:1px solid var(--border);color:var(--muted)}
    .status-pill{text-transform:capitalize}

    /* ---- cards ---- */
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px}
    .card{
      background:linear-gradient(180deg,var(--surface),#12161d);
      border:1px solid var(--border);border-radius:var(--radius);padding:20px 20px 18px;
      box-shadow:var(--shadow);transition:transform .16s ease,border-color .16s ease,box-shadow .16s ease;
      display:block;color:inherit}
    a.card:hover{text-decoration:none;transform:translateY(-3px);border-color:#3d6fb0;
      box-shadow:0 10px 30px rgba(31,111,235,.18)}
    .card-top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:6px}
    .card h3{margin:0;font-size:17px;color:var(--heading)}
    .card .client{color:var(--muted);font-size:13px;margin-top:1px}
    .card .target{margin:10px 0 14px;font-size:12.5px;color:var(--muted);
      word-break:break-all;display:flex;align-items:center;gap:7px}
    .card .target svg{flex:none;opacity:.7}

    /* ---- severity strip ---- */
    .sev-strip{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
    .sev-chip{display:inline-flex;align-items:baseline;gap:5px;padding:3px 9px;border-radius:7px;
      font-size:12px;font-weight:700;border:1px solid transparent}
    .sev-chip .n{font-size:13px}
    .sev-chip.zero{opacity:.35;font-weight:600}

    /* ---- risk meter (mini, on cards) ---- */
    .risk-mini{text-align:right;flex:none}
    .risk-mini .val{font-size:22px;font-weight:800;line-height:1}
    .risk-mini .lbl{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
      color:var(--muted);margin-top:3px}
    .track{height:5px;border-radius:3px;background:var(--elevated);overflow:hidden;margin-top:11px}
    .track > i{display:block;height:100%;border-radius:3px;width:0;transition:width 1s cubic-bezier(.16,1,.3,1)}

    /* ---- detail panels ---- */
    .panels{display:grid;grid-template-columns:300px 1fr;gap:22px;margin-bottom:26px;align-items:start}
    @media(max-width:820px){.panels{grid-template-columns:1fr}}
    .panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      padding:20px;box-shadow:var(--shadow)}
    .panel h2{margin:0 0 14px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
    .gauge-wrap{display:flex;flex-direction:column;align-items:center}
    .gauge-svg{width:210px;max-width:100%}
    .gauge-fill-path{transition:stroke-dashoffset 1.4s cubic-bezier(.16,1,.3,1)}
    .risk-caption{margin-top:8px;font-size:13px;color:var(--muted);text-align:center}
    .bar-chart-svg{width:100%;height:auto}

    .meta-list{list-style:none;margin:0;padding:0}
    .meta-list li{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
      border-bottom:1px solid var(--border);font-size:13.5px}
    .meta-list li:last-child{border-bottom:0}
    .meta-list .k{color:var(--muted)}
    .meta-list .v{color:var(--text);text-align:right;word-break:break-word}

    .recon-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:12px}
    .recon-stat{background:var(--elevated);border:1px solid var(--border);border-radius:10px;
      padding:14px 10px;text-align:center}
    .recon-stat .num{font-size:24px;font-weight:800;color:var(--heading);line-height:1}
    .recon-stat .cap{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:6px}

    /* ---- findings table ---- */
    .table-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
      overflow:hidden;box-shadow:var(--shadow)}
    .table-scroll{overflow-x:auto}
    table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
    thead th{text-align:left;padding:12px 16px;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
      color:var(--muted);font-weight:700;border-bottom:1px solid var(--border);background:#12161d}
    tbody td{padding:12px 16px;border-bottom:1px solid var(--border);vertical-align:middle}
    tbody tr:last-child td{border-bottom:0}
    tbody tr{transition:background .12s ease}
    tbody tr:hover{background:rgba(88,166,255,.05)}
    td.sev-cell{white-space:nowrap}
    .sid{color:var(--muted);font-size:12.5px}
    .f-title{color:var(--heading);font-weight:600}
    .f-title a{color:var(--heading)}
    .empty{padding:44px 20px;text-align:center;color:var(--muted)}

    /* ---- finding detail ---- */
    .sev-banner{display:flex;align-items:center;gap:14px;padding:16px 20px;border-radius:var(--radius);
      border:1px solid var(--border);margin-bottom:24px}
    .sev-banner .big{font-size:13px;font-weight:800;letter-spacing:.05em;text-transform:uppercase}
    .kv-row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:26px}
    .kv{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 14px}
    .kv .k{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
    .kv .v{font-size:14px;color:var(--heading);font-weight:600;margin-top:2px}
    .section{margin-bottom:24px}
    .section h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);
      margin:0 0 8px;font-weight:700}
    .section .body{background:var(--surface);border:1px solid var(--border);border-radius:10px;
      padding:16px 18px;white-space:pre-wrap;word-break:break-word}
    .section pre.body{overflow-x:auto;white-space:pre;font-size:13px;color:#adbac7}
    .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 15px;border-radius:8px;
      border:1px solid var(--border);background:var(--elevated);color:var(--text);font-size:13.5px;
      font-weight:600;cursor:pointer}
    .btn:hover{text-decoration:none;border-color:#3d6fb0;color:var(--heading)}
    .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
    footer{max-width:1180px;margin:0 auto;padding:0 24px 40px;color:var(--muted);font-size:12px}
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="{{ url_for('index') }}">
        <span class="logo">H</span>
        <span>HAKUZA <small>web dashboard</small></span>
      </a>
      <div class="spacer"></div>
      <div class="crumb">{% block crumb %}{% endblock %}</div>
    </div>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>
    HAKUZA — Unified Penetration Testing Platform · read-only engagement view ·
    data from <span class="mono">~/.hakuza/hakuza.db</span>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
