[pytest]
# HAKUZA Comprehensive Test Suite Configuration
# Pytest configuration for 1500+ tests with coverage thresholds

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test* *Tests
python_functions = test_*

# Markers for test categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for module interactions
    performance: Performance and benchmark tests
    security: Security-specific tests (injection, auth, secrets)
    regression: Regression tests for golden path workflows
    stress: High-load and stress tests
    chaos: Failure handling and chaos tests
    compatibility: Python version compatibility tests
    e2e: End-to-end and real-world scenario tests
    mutation: Mutation testing for code quality
    slow: Tests that take >1 second
    requires_network: Tests requiring network connectivity
    requires_db: Tests requiring database
    requires_file_io: Tests requiring file system operations
    flaky: Known flaky tests (may fail intermittently)
    skip_ci: Tests to skip in CI environment

# Test execution options
testpaths = .
norecursedirs = .git .github docs webapp/node_modules .pytest_cache __pycache__ .venv venv
# NOTE: coverage/HTML/JUnit reporting requires pytest-cov + pytest-html (see
# requirements-test.txt). Those flags are intentionally NOT in the defaults so a
# bare `pytest` runs with only pytest installed. For the full reported suite run:
#     ./run_tests.sh --coverage
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra
    --maxfail=10

# Coverage thresholds (fail tests if below these)
[coverage:run]
source = .
omit =
    */tests/*
    */test_*.py
    setup.py
    conftest.py
    venv/*
    .venv/*
    */site-packages/*
    */mock*
    */fixtures/*
    __pycache__/*

[coverage:report]
# Require minimum coverage percentages
fail_under = 85
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
    @abstractproperty
    if sys.version_info
    pass
    ...

[coverage:html]
directory = htmlcov

[coverage:json]
output = coverage.json
pretty_print = true

# Timeout for slow tests (seconds)
timeout = 300
timeout_method = thread

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

log_file = pytest.log
log_file_level = DEBUG
log_file_format = %(asctime)s [%(levelname)8s] %(filename)s:%(lineno)d %(funcName)s() %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
